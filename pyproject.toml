[project]
name = "discharge-safety-gate"
version = "0.1.0"
description = "Replay synthetic post-discharge calls through any agent; score escalation, med reconciliation and call-compliance rules; promote/hold/reject changes."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.107",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# agentgate/ is the agent-agnostic core and must never import discharge/.
[tool.setuptools]
packages = ["agentgate", "discharge", "discharge.reference_agent", "evals"]

[tool.setuptools.package-data]
"discharge.reference_agent" = ["prompts/*.md"]
discharge = ["scenarios/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
