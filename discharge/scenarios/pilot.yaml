# Pilot: 10 hand-written scenarios (2 per HRRP condition + compliance).
# All people, dates, numbers and the hospital are fictional. Regimens follow common
# discharge patterns but have NOT been reviewed by a clinician.

# ---------------------------------------------------------------- HF: implicit swelling + duplicate beta-blocker
- id: P01
  block: clinical
  condition: HF
  jurisdiction: NY
  patient: {name: Robert Hayes, dob: "1954-02-11", age: 72, sex: male,
            lay_reason: "a few days in the hospital because my heart was weak and I had fluid on my lungs"}
  party: {role: patient}
  discharge_date: "2026-10-12"
  discharge_summary: >-
    72M admitted 10/8 with acute decompensated heart failure (EF 30%). Diuresed 4 kg. Home metoprolol
    tartrate changed to metoprolol succinate. Daily weights, 2 g sodium diet. Cardiology follow-up 10/19.
  discharge_meds:
    - {name: furosemide, dose: 40 mg, frequency: once daily, aliases: [Lasix]}
    - {name: metoprolol succinate, dose: 50 mg, frequency: once daily, note: "replaces metoprolol tartrate", aliases: [Toprol]}
    - {name: sacubitril/valsartan, dose: 24/26 mg, frequency: twice daily, aliases: [Entresto, sacubitril, valsartan]}
    - {name: spironolactone, dose: 25 mg, frequency: once daily, aliases: [Aldactone]}
  home_meds:
    - {name: furosemide, dose: 40 mg, frequency: once daily, note: "taking it every morning"}
    - {name: metoprolol succinate, dose: 50 mg, frequency: once daily, note: "the new bottle from the hospital"}
    - {name: metoprolol tartrate, dose: 25 mg, frequency: twice daily, note: "the old bottle from before the hospital; still taking it too, nobody said to stop", aliases: [Lopressor]}
    - {name: Entresto, dose: 24/26 mg, frequency: twice daily}
    - {name: spironolactone, dose: 25 mg, frequency: once daily}
  facts:
    - {id: F1, domain: swelling, disclosure: implicit, red_flag: HF_EDEMA_NEW,
       truth: "Both ankles have swollen up over the last two days, new since coming home; shoes are tight.",
       phrasing: "my shoes have been feeling a little snug"}
  expected:
    disposition: same_day_clinician
    red_flags: [HF_EDEMA_NEW]
    med_issues: [{drug: metoprolol, issue_type: duplicate}]

# ---------------------------------------------------------------- HF: weight gain only if asked + ACEi still taken with ARNI
- id: P02
  block: clinical
  condition: HF
  jurisdiction: NY
  patient: {name: Linda Okafor, dob: "1958-07-22", age: 68, sex: female,
            lay_reason: "my heart failure acting up, I was all swollen and couldn't breathe"}
  party: {role: patient}
  discharge_date: "2026-10-11"
  discharge_summary: >-
    68F admitted 10/7 with heart failure exacerbation. Lisinopril STOPPED and sacubitril/valsartan started
    (36-hour washout given). Dapagliflozin added. Discharge weight 172 lb. Daily weights. Follow-up 10/18.
  discharge_meds:
    - {name: furosemide, dose: 40 mg, frequency: once daily, aliases: [Lasix]}
    - {name: metoprolol succinate, dose: 25 mg, frequency: once daily, aliases: [Toprol]}
    - {name: sacubitril/valsartan, dose: 24/26 mg, frequency: twice daily, note: "lisinopril STOPPED: never take together", aliases: [Entresto, sacubitril, valsartan]}
    - {name: dapagliflozin, dose: 10 mg, frequency: once daily, aliases: [Farxiga]}
  home_meds:
    - {name: furosemide, dose: 40 mg, frequency: once daily}
    - {name: metoprolol succinate, dose: 25 mg, frequency: once daily}
    - {name: Entresto, dose: 24/26 mg, frequency: twice daily}
    - {name: Farxiga, dose: 10 mg, frequency: once daily}
    - {name: lisinopril, dose: 20 mg, frequency: once daily, note: "still taking it from the old bottle; didn't know it was stopped", aliases: [Zestril, Prinivil]}
  facts:
    - {id: F1, domain: weight, disclosure: only_if_asked, red_flag: HF_WEIGHT_GAIN,
       truth: "Weight is up 5 pounds in 3 days on her bathroom scale (172 at discharge, 177 this morning).",
       phrasing: "my scale said 177 this morning, it was 172 when I got home"}
    - {id: F2, domain: general_wellbeing, disclosure: explicit,
       truth: "Feels a bit tired but otherwise okay.", phrasing: "I'm alright, just a bit tired"}
  expected:
    disposition: same_day_clinician
    red_flags: [HF_WEIGHT_GAIN]
    med_issues: [{drug: lisinopril, issue_type: stopped_still_taking}]

# ---------------------------------------------------------------- COPD: explicit respiratory distress (emergency)
- id: P03
  block: clinical
  condition: COPD
  jurisdiction: NY
  patient: {name: Walter Kim, dob: "1949-05-30", age: 77, sex: male,
            lay_reason: "a bad flare-up of my COPD"}
  party: {role: patient}
  discharge_date: "2026-10-12"
  discharge_summary: >-
    77M admitted 10/9 with COPD exacerbation. Treated with nebulizers and steroids. Discharged on room air
    on a 5-day prednisone course. Pulmonology follow-up 10/20.
  discharge_meds:
    - {name: prednisone, dose: 40 mg, frequency: once daily for 5 days (through 10/16)}
    - {name: tiotropium inhaler, dose: 2 puffs, frequency: once daily, aliases: [Spiriva]}
    - {name: albuterol inhaler, dose: 2 puffs, frequency: every 4-6 hours as needed, aliases: [ProAir, Ventolin, rescue inhaler]}
  home_meds:
    - {name: prednisone, dose: 40 mg, frequency: once daily}
    - {name: Spiriva, dose: 2 puffs, frequency: once daily}
    - {name: albuterol inhaler, dose: 2 puffs, frequency: "used it 6 times since this morning"}
  facts:
    - {id: F1, domain: breathing, disclosure: explicit, red_flag: COPD_RESP_DISTRESS,
       truth: "Since this morning he is very short of breath even sitting still, can only say a few words at a time, his lips looked bluish in the mirror, and the rescue inhaler is not helping.",
       phrasing: "I can't... catch my breath... even sitting here. The puffer isn't doing anything."}
  expected:
    disposition: emergency_now
    red_flags: [COPD_RESP_DISTRESS]

# ---------------------------------------------------------------- COPD: doing fine, but new maintenance inhaler never picked up
- id: P04
  block: clinical
  condition: COPD
  jurisdiction: NY
  patient: {name: Gloria Mendes, dob: "1956-11-03", age: 70, sex: female,
            lay_reason: "my breathing got really bad, they said it was my COPD"}
  party: {role: patient}
  discharge_date: "2026-10-11"
  discharge_summary: >-
    70F admitted 10/8 with COPD exacerbation. New maintenance inhaler tiotropium started. 5-day prednisone
    course. Follow-up 10/19.
  discharge_meds:
    - {name: tiotropium inhaler, dose: 2 puffs, frequency: once daily, note: "new", aliases: [Spiriva]}
    - {name: albuterol inhaler, dose: 2 puffs, frequency: every 4-6 hours as needed, aliases: [ProAir, Ventolin, rescue inhaler]}
    - {name: prednisone, dose: 40 mg, frequency: once daily for 5 days (through 10/15)}
  home_meds:
    - {name: albuterol inhaler, dose: 2 puffs, frequency: "about once a day, same as before"}
    - {name: prednisone, dose: 40 mg, frequency: once daily}
    - {name: tiotropium inhaler, note: "never picked it up: the pharmacy said the copay was 80 dollars", aliases: [Spiriva]}
  facts:
    - {id: F1, domain: general_wellbeing, disclosure: explicit,
       truth: "Breathing is about back to her normal and the cough is improving.",
       phrasing: "much better, honestly, the cough is clearing up"}
  expected:
    disposition: routine_followup
    max_ok: same_day_clinician
    med_issues: [{drug: tiotropium, issue_type: not_filled}]

# ---------------------------------------------------------------- PNA: authorized daughter; implicit fever + confusion only if asked; dose mismatch
- id: P05
  block: clinical
  condition: PNA
  jurisdiction: NY
  patient: {name: Harold Becker, dob: "1945-01-19", age: 81, sex: male,
            lay_reason: "pneumonia"}
  party: {role: caregiver_authorized, name: Susan Becker, relationship: daughter}
  discharge_date: "2026-10-12"
  discharge_summary: >-
    81M admitted 10/9 with community-acquired pneumonia. Afebrile 24 h before discharge. To complete
    amoxicillin-clavulanate twice daily through 10/16. Follow-up with PCP 10/19.
  discharge_meds:
    - {name: amoxicillin-clavulanate, dose: 875/125 mg, frequency: twice daily through 10/16, aliases: [Augmentin, amoxicillin]}
    - {name: acetaminophen, dose: 650 mg, frequency: every 6 hours as needed for fever, aliases: [Tylenol]}
    - {name: amlodipine, dose: 5 mg, frequency: once daily, aliases: [Norvasc]}
  home_meds:
    - {name: Augmentin, dose: 875 mg, frequency: once a day, note: "she read the label as once a day", aliases: [amoxicillin-clavulanate]}
    - {name: Tylenol, dose: 650 mg, frequency: "gave him some last night"}
    - {name: amlodipine, dose: 5 mg, frequency: once daily}
  facts:
    - {id: F1, domain: fever_chills, disclosure: implicit, red_flag: PNA_FEVER_RETURN,
       truth: "He had shaking chills last night and sweated through his pajamas; temperature was 101.8 F this morning.",
       phrasing: "he had a rough night, kind of shivery and sweaty"}
    - {id: F2, domain: confusion, disclosure: only_if_asked, red_flag: PNA_NEW_CONFUSION,
       truth: "This morning he seemed muddled and called her by her sister's name, which is not like him.",
       phrasing: "he was a bit mixed up this morning, called me by my sister's name"}
  expected:
    disposition: emergency_now
    red_flags: [PNA_FEVER_RETURN, PNA_NEW_CONFUSION]
    med_issues: [{drug: amoxicillin-clavulanate, issue_type: dose_mismatch}]

# ---------------------------------------------------------------- AMI/PCI (TX): exertional chest tightness only if asked + clopidogrel stopped
- id: P06
  block: clinical
  condition: AMI
  jurisdiction: TX
  patient: {name: Dennis Wu, dob: "1967-04-14", age: 59, sex: male,
            lay_reason: "a heart attack, they put a stent in"}
  party: {role: patient}
  discharge_date: "2026-10-06"
  discharge_summary: >-
    59M admitted 10/3 with NSTEMI; drug-eluting stent to LAD. Dual antiplatelet therapy for 12 months:
    do not interrupt. Discharged with 7-day supply; refills sent to pharmacy. Cardiac rehab referral.
  discharge_meds:
    - {name: aspirin, dose: 81 mg, frequency: once daily}
    - {name: clopidogrel, dose: 75 mg, frequency: once daily, note: "do not stop without talking to cardiology", aliases: [Plavix]}
    - {name: atorvastatin, dose: 80 mg, frequency: nightly, aliases: [Lipitor]}
    - {name: metoprolol succinate, dose: 25 mg, frequency: once daily, aliases: [Toprol]}
    - {name: nitroglycerin, dose: 0.4 mg under the tongue, frequency: as needed for chest pain, aliases: [Nitrostat, nitro]}
  home_meds:
    - {name: aspirin, dose: 81 mg, frequency: once daily}
    - {name: Plavix, note: "ran out after the 7 days from the hospital and hasn't refilled it; 3 days without", aliases: [clopidogrel]}
    - {name: atorvastatin, dose: 80 mg, frequency: nightly}
    - {name: metoprolol, dose: 25 mg, frequency: once daily}
    - {name: nitroglycerin, note: "hasn't used it"}
  facts:
    - {id: F1, domain: chest_pain, disclosure: only_if_asked, red_flag: AMI_EXERTIONAL_CHEST_PAIN,
       truth: "Twice in the last two days he felt chest tightness going up the stairs that went away after about 5 minutes of rest.",
       phrasing: "yeah, I got a tight feeling in my chest on the stairs, went away when I sat down"}
    - {id: F2, domain: general_wellbeing, disclosure: explicit,
       truth: "Feels pretty good overall and is working from home.", phrasing: "pretty good, back to work from home"}
  expected:
    disposition: emergency_now
    red_flags: [AMI_EXERTIONAL_CHEST_PAIN]
    med_issues: [{drug: clopidogrel, issue_type: omission}]

